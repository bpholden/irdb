### LRIS-2 RED arm optics
#
# Everything the red arm's light passes through in ANY mode: the arm's common
# path, the dichroic in transmission and the red CCD QE. Loaded by both IMG_R
# and LSS_R. Mode-specific optics (filters, grating, slit, trace) live in
# LRIS-2_IMG.yaml and LRIS-2_LSS_R.yaml.

object: instrument
alias: INST
name: LRIS-2_R
description : LRIS-2 red arm optics common to all modes
date_created: 2026-10-21

effects:
  - name: red_common_path
    description: Window, collimator (2 mirrors), fold mirror and camera of the red arm,
                 from the LRIS-2 ETC. Excludes the dichroic, which is dichroic_red below.
    class: TERCurve
    include: True
    kwargs:
      filename: TER_LRIS-2_red_common_path.dat

  - name: dichroic_red
    description: LRIS-2 dichroic in TRANSMISSION, which is the red side. Crossover is
                 at 560 nm, above which the dichroic transmits about 98 percent.
                 Same physical part and same data file as dichroic_blue in
                 LRIS-2_B.yaml, which takes the reflection column instead.
    class: TERCurve
    include: True
    kwargs:
      filename: TER_LRIS-2_dichroic.dat
      action: transmission

  - name: LRIS-2_red_detector_qe
    description: QE curve for the LRIS-2 red CCD, STA4850 ID280 at -110 degC.
                 Vendor text file. Exactly one detector QE curve may be active,
                 which is why the blue curve lives in LRIS-2_B.yaml.
    class: QuantumEfficiencyCurve
    include: True
    kwargs:
      filename: STA4850_ID280_QE_v0.880b.txt

### LRIS-2 instrument

object: instrument
alias: INST
name: LRIS-2
description : The LRIS-2 common optics
date_created: 2026-08-14
date_modified: 2026-08-14
changes:
  - 2026-08-14 (BPH) Created file based on METIS.yaml


properties:
  pixel_scale: 0.15        # [arcsec / pixel]
  plate_scale: 10.0        # [arcsec / mm]
  filter_file_format : "filters/TC_filter_{}.dat"

effects:
- name: entrance_aperture
  description: LRIS-2 imaging field of view, 10 arcmin x 5 arcmin. The detector
               itself is a full 4080 x 4080 array, so the CCD area outside this
               aperture is not illuminated and reads out as bias plus dark only.
  class: ApertureMask
  include: True
  kwargs:
    array_dict:
      x: [-300,  300, 300, -300]   # 600 arcsec = 10 arcmin
      y: [-150, -150, 150,  150]   # 300 arcsec =  5 arcmin
    x_unit: arcsec
    y_unit: arcsec
    angle: 0
    angle_unit: deg
    shape: rect
    conserve_image: True

- name : adc_throughput
  description : Throughput of the Keck I Cassegrain ADC. This is Keck I hardware, but it
                lives in the LRIS-2 package rather than the Keck package because it is a
                Cassegrain ADC and cannot be used by any instrument that is not at
                Cassegrain focus. The only other Cassegrain instrument, MOSFIRE, cannot
                use it either, because of how MOSFIRE is designed. So LRIS-2 is currently
                its only user. Being in this file, it applies to all LRIS-2 modes.
                The residual dispersion left after ADC correction is modelled separately
                by the adc_residuals effect in Maunakea.yaml.
  class : TERCurve
  include : True
  kwargs :
    filename : TER_keck_adc.dat

### LRIS-2 long-slit, blue arm
#
# Loaded by the LSS_B mode. Holds what is specific to blue long-slit
# spectroscopy: the B600 grating, the slit and the spectral trace. The arm's
# common path, dichroic and CCD QE are in LRIS-2_B.yaml, which IMG_B also loads.
#
# THE TRACE GEOMETRY IS PROVISIONAL. See code/make_lss_traces.py - it is a
# straight, untilted, linearly dispersed trace, which is a starting point and
# not a real optical model.

object: instrument
alias: INST
name: LRIS-2_LSS_B
description : LRIS-2 blue long-slit arm
date_created: 2026-08-21

properties:
  decouple_detector_from_sky_headers: True   # required for slit spectroscopy
  grating_names:
    - B600

effects:
  - name: grating_efficiency
    description: B600 grating efficiency. Grating assembly only - telescope, ADC,
                 collimator, dichroic, camera and QE are all applied separately.
                 Piggybacks on FilterWheel, as OSIRIS does.
    class: FilterWheel
    include: True
    kwargs:
      minimum_throughput: 0.
      filename_format: "gratings/{}.dat"
      current_filter: "!OBS.grating_name"
      filter_names: "!INST.grating_names"

  - name: slit_wheel
    description: LRIS-2 long slits
    class: SlitWheel
    include: True
    kwargs:
      filename_format: "longslits/LongSlit{}Arcsec.dat"
      current_slit: "!OBS.longslit_name"
      slit_names:
        - "0.7"

  - name: spectral_trace_wheel
    description: spectral trace geometry for the blue arm. PROVISIONAL - straight,
                 untilted, linear dispersion. Regenerate with code/make_lss_traces.py.
    class: SpectralTraceListWheel
    include: True
    kwargs:
      wave_colname: "wavelength"
      s_colname: "xi"
      current_trace_list: "!OBS.grating_name"
      filename_format: "traces/LSS_{}_TRACE.fits"
      trace_list_names: "!INST.grating_names"

---
### detector parameters for LSS
object : detector
alias : DET
name : LRIS-2_LSS_B_detector_params
description : LSS runs unbinned, unlike imaging

properties:
  binx: 1
  biny: 1
  ccdsum: '1 1'

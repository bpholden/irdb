### LRIS-2 DETECTOR
#
# READOUT AMPLIFIERS
# The device has four readout amplifiers, each with its own overscan region.
# ScopeSim has no amplifier concept at all - there is no overscan, prescan or
# amplifier effect anywhere in the codebase - so all four currently share the
# single set of values below (gain, readout noise, bias, overscan). That is
# adequate while the values are identical, which they are for now.
#
# To model them separately later, the two viable routes are:
#   1. Split the array into four quadrants as four DetectorList entries, each
#      with its own gain. ReferencePixelBorder accepts a dict keyed by
#      detector id, so each amplifier can then take its own border. The
#      readout becomes four HDUs, which is how many multi-amp CCD raw frames
#      are actually stored.
#   2. Write a real Overscan effect that appends readout rows to the array.
#
# CAVEAT ON THE OVERSCAN BELOW
# ReferencePixelBorder blanks rows *inside* the 4080x4080 imaging area rather
# than appending extra readout rows beyond it, so the frame stays 4080x4080
# and the device loses 100 rows of imaging area instead of gaining 100 rows of
# overscan. The blanked rows do pick up bias and readout noise, so their
# content is right even though the frame geometry is not. Harmless while the
# 10x5 arcmin aperture leaves those rows unilluminated anyway.
object : detector
alias : DET
name : LRIS-2_detector
description : A single 4k detector

properties :
    image_plane_id : 0
    temperature : -120
    binx : 2
    biny: 2
    dit : "!OBS.dit"
    ndit : "!OBS.ndit"

effects :
  - name: LRIS-2_4k_detector
    class: DetectorList
    kwargs:
      array_dict:
        id: [1]
        x_cen: [0]
        y_cen: [0]
        x_size: [4080]
        y_size: [4080]
        pixel_size: [0.015]
        angle: [0.]
        gain: [1.]
      x_cen_unit : mm
      y_cen_unit : mm
      x_size_unit : pixel
      y_size_unit : pixel
      pixel_size_unit : mm
      angle_unit : deg
      gain_unit : electron/adu
      image_plane_id : 0

  - name: exposure_integration
    description: Summing up sky signal for all DITs and NDITs
    class: ExposureIntegration

  - name: dark_current
    description : LRIS-2 dark current
    class: DarkCurrent
    # [e-/s] level of dark current for each detector
    kwargs:
        value: 0.001

  - name: shot_noise
    description : apply poisson shot noise to images
    class: ShotNoise

  - name: detector_linearity
    description : Linearity characteristics of LRIS-2 chip
    class: LinearityCurve
    include: False
    kwargs:
        array_dict:
          incident: [0, 64e3]
          measured: [0, 64e3]

  - name: overscan_regions
    description: 50-pixel overscan strips along the top and bottom of the device.
                 Sequence is [bottom, left, top, right], in unbinned pixels, so
                 this is 25 rows each at the current 2x2 binning. One set of
                 values is used for all four readout amplifiers for now; see the
                 note in this file about modelling them separately.
    class: ReferencePixelBorder
    kwargs:
      border: [50, 0, 50, 0]

  - name : readout_noise
    description : Readout noise frames
    class : BasicReadoutNoise
    kwargs :
        noise_std : 5


  - name: binning
    description: Applies binning
    class: UnequalBinnedImage
    include: True
    kwargs:
        binx: "!DET.binx"
        biny: "!DET.biny"

  - name : bias
    description : Bias level
    class : Bias
    kwargs :
        bias : 1800

  - name : extra_fits_keywords
    decription : adds extra FITS keywords from a yaml file
    class : ExtraFitsKeywords
    include : True
    kwargs :
      filename: FITS_extra_keywords.yaml

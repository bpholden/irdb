### default observation parameters needed for an LRIS-2 simulation

object : configuration
alias : OBS
name : LRIS-2_default_configuration
description : default parameters needed for a LRIS-2 simulation
status: experimental
date_created: 2026-08-14
date_modified: 2026-08-14
changes:
  - 2026-08-14 (BPH) Created file based on METIS default.yaml


packages :
- Maunakea
- Keck
- LRIS-2

yamls :
- Maunakea.yaml
- Keck.yaml
- LRIS-2.yaml
- LRIS-2_DET.yaml

properties :
  instrument: LRIS-2
  modes : ["IMG"]
  airmass : 1.1
  # az must be given explicitly: get_observation_info_from_cmds() passes
  # az=None when !OBS.az is missing, which overrides get_target()'s az=0
  # default and raises. 180 deg = pointing due south.
  az : 180.0
  declination : 0
  hour_angle : 0
  pupil_angle : 0
  dit : 60
  ndit : 1
  bias : 1040
  mjdobs : 61267.4
  object : "ASTRO"
  # NOTE: these are deliberately NOT called "ra"/"dec". ScopeSim's get_target()
  # gives !OBS.ra / !OBS.dec precedence over !OBS.airmass, so defining them
  # would silently override the airmass set above. They are named target_ra /
  # target_dec so they only ever feed the FITS headers, and !OBS.airmass stays
  # the single knob controlling the sky model. See FITS_extra_keywords.yaml.
  target_ra : "21:29:58.000"
  target_dec : "12:10:01.000"
  obsmode : 'LRIS-2Bias'

mode_yamls :
- object : instrument
  alias: OBS
  name : IMG
  description : "LRIS-2 imaging mode"
  properties:
    filter_name : sdss_r
    grating_name : None
    longslit_name: None
    obsmode: LRIS-2Bias
  yamls:
    - LRIS-2_IMG.yaml

- object : instrument
  alias: OBS
  name : LSS
  description : "LRIS-2 Long-Slit mode"
  properties:
    filter_name : open
    grating_name : R400
    longslit_name : "0.6"
    obsmode : 'LRIS-2LongSlitSpectroscopy'
  yamls:
    - LRIS-2_LSS.yaml


---
### default simulation parameters needed for an LRIS-2 simulation
object: simulation
alias: SIM
name: LRIS-2_simulation_parameters
description: RC simulation parameters which need to change for a LRIS-2 run

properties:
  random:
    seed: None                         # 9001

  spectral:   # in [um]
    wave_min: 0.555
    wave_mid: 0.777
    wave_max: 1.000
    spectral_bin_width: 0.0005       # 0.5 Angstrom

  computing:
    spline_order: 1
    preload_field_of_views: True

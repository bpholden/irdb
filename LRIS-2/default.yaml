### default observation parameters needed for an LRIS-2 simulation

object : configuration
alias : OBS
name : LRIS-2_default_configuration
description : default parameters needed for a LRIS-2 simulation
status: experimental
date_created: 2026-08-14
date_modified: 2026-08-14
changes:
  - 2026-08-14 (BPH) Created file based on METIS default.yaml


packages :
- Maunakea
- Keck
- LRIS-2

yamls :
- Maunakea.yaml
- Keck.yaml
- LRIS-2.yaml
- LRIS-2_DET.yaml

properties :
  instrument: LRIS-2
  modes : ["IMG_R"]
  airmass : 1.1
  # Fallback wavelength range, overridden by whichever mode is selected below.
  # Defaults to the red arm.
  wave_min : 0.555
  wave_mid : 0.800
  wave_max : 1.100
  # az must be given explicitly: get_observation_info_from_cmds() passes
  # az=None when !OBS.az is missing, which overrides get_target()'s az=0
  # default and raises. 180 deg = pointing due south.
  az : 180.0
  declination : 0
  hour_angle : 0
  pupil_angle : 0
  dit : 60
  ndit : 1
  bias : 1040
  mjdobs : 61267.4
  object : "ASTRO"
  # NOTE: these are deliberately NOT called "ra"/"dec". ScopeSim's get_target()
  # gives !OBS.ra / !OBS.dec precedence over !OBS.airmass, so defining them
  # would silently override the airmass set above. They are named target_ra /
  # target_dec so they only ever feed the FITS headers, and !OBS.airmass stays
  # the single knob controlling the sky model. See FITS_extra_keywords.yaml.
  target_ra : "21:29:58.000"
  target_dec : "12:10:01.000"
  obsmode : 'LRIS-2Bias'

mode_yamls :
- object : instrument
  alias: OBS
  name : IMG_R
  description : "LRIS-2 imaging, red arm (above the 560 nm dichroic crossover)"
  properties:
    filter_name : sdss_r
    grating_name : None
    longslit_name: None
    obsmode: LRIS-2Bias
    wave_min : 0.555        # above the 560 nm dichroic crossover
    wave_mid : 0.800
    wave_max : 1.100        # 1.100 is the hard ceiling: the ADC, collimator,
                            # dichroic and red CCD QE curves all stop there.
                            # sdss_z reaches 1.35 um and so is still clipped,
                            # but red QE is only 0.025 by 1.10 um so the loss
                            # is negligible.
  yamls:
    - LRIS-2_IMG.yaml
    - LRIS-2_IMG_R.yaml

- object : instrument
  alias: OBS
  name : IMG_B
  description : "LRIS-2 imaging, blue arm (below the 560 nm dichroic crossover)"
  properties:
    filter_name : sdss_g
    grating_name : None
    longslit_name: None
    obsmode: LRIS-2Bias
    wave_min : 0.300        # below the 560 nm dichroic crossover
    wave_mid : 0.450
    wave_max : 0.600
  yamls:
    - LRIS-2_IMG.yaml
    - LRIS-2_IMG_B.yaml

- object : instrument
  alias: OBS
  name : LSS_R
  description : "LRIS-2 long-slit, red arm (R400)"
  properties:
    filter_name : open
    grating_name : R400
    longslit_name : "0.7"
    obsmode : 'LRIS-2LongSlitSpectroscopy'
    wave_min : 0.520          # detector edge for R400: 5195 A
    wave_mid : 0.750          # central wavelength 7500 A
    wave_max : 0.985          # detector edge for R400: 9805 A
  yamls:
    - LRIS-2_LSS_R.yaml

- object : instrument
  alias: OBS
  name : LSS_B
  description : "LRIS-2 long-slit, blue arm (B600)"
  properties:
    filter_name : open
    grating_name : B600
    longslit_name : "0.7"
    obsmode : 'LRIS-2LongSlitSpectroscopy'
    wave_min : 0.313          # detector edge for B600: 3135 A
    wave_mid : 0.440          # central wavelength 4400 A
    wave_max : 0.567          # detector edge for B600: 5665 A
  yamls:
    - LRIS-2_LSS_B.yaml

---
### default simulation parameters needed for an LRIS-2 simulation
object: simulation
alias: SIM
name: LRIS-2_simulation_parameters
description: RC simulation parameters which need to change for a LRIS-2 run

properties:
  random:
    seed: None                         # 9001

  spectral:   # in [um]
    # Deferred to the selected mode. A SIM document inside a mode yaml does NOT
    # work: _load_yaml_dict() processes mode_yamls while handling the first
    # document of this file, so this SIM document is read afterwards and would
    # overwrite it. Bang keys resolve lazily, so load order stops mattering.
    wave_min: "!OBS.wave_min"
    wave_mid: "!OBS.wave_mid"
    wave_max: "!OBS.wave_max"
    spectral_bin_width: 0.0005       # 0.5 Angstrom

  computing:
    spline_order: 1
    preload_field_of_views: True

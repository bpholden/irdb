### LRIS-2 IMG config

object: instrument
alias: INST
name: LRIS-2_IMG
description : LRIS-2 imaging optics common to both arms
date_created: 2022-05-06

effects:
  # NOTE: this was a SpanishVOFilterWheel querying observatory=Keck,
  # instrument=LRIS-2. That can never work: SVO has no "LRIS-2" instrument
  # (only the original LRIS), and none of its Keck/LRIS entries carry the
  # "_filter" suffix, so the wheel came back empty. Local curves also mean
  # no network round-trip on every run. Replace the files in filters/ with
  # the as-built LRIS-2 curves when they exist.
  - name: filter_wheel
    description: LRIS-2 imaging filters
    class: FilterWheel
    include: True
    kwargs:
      filter_names:
        - sdss_u
        - sdss_g
        - sdss_r
        - sdss_i
        - sdss_z
      filename_format: "!INST.filter_file_format"
      current_filter: "!OBS.filter_name"
      minimum_throughput: 0.
      action: "transmission"

  # NOTE: the detector QE curves are NOT here. They are arm-specific and mutually
  # exclusive - the red and blue CCDs are alternative arms, not surfaces in series,
  # so enabling both would multiply the two QE curves together. Each arm file
  # enables exactly one. See LRIS-2_IMG_R.yaml and LRIS-2_IMG_B.yaml.

  - name: LRIS-2_imaging_optics
    description: Throughput of the LRIS-2 CAMERA optics only. The collimator is in
                 LRIS-2.yaml, the dichroic is in the per-arm files, and the telescope
                 mirrors are the SurfaceList in Keck.yaml, so none belong here.
                 A real replacement curve must exclude all three or it will double-count.
    class: TERCurve
    include: True
    kwargs:
      filename: TER_LRIS-2_imaging_optics.dat

---
### default detector parameters for IMG
object : detector
alias : DET
name : LRIS-2_IMG_detector_params
description : Default detector params for IMG

properties:
  binx: 2 
  biny: 2 
  ccdsum: '2 2'

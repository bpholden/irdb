# Config file for the Keck-I telescope
object: telescope
alias: TEL
name: keck
description : Keck I telescope

properties :
  telescope : keck
  temperature : "!ATMO.temperature"
  mirror_list : LIST_keck_mirrors.dat   # an instrument may override this, as LRIS-2 does

effects:
- name : telescope_reflection
  description : Combined reflection from all telescope mirrors (placeholder)
  class : SurfaceList
  include : True
  kwargs :
    filename : "!TEL.mirror_list"

### Config file for the Mauna Kea atmosphere and location
object : atmosphere
alias : ATMO
name : MaunaKea
description : Atmosphere and location details for the Mauna Kea observatory

properties :
    location :      MaunaKea
    altitude :      4123        # m
    longitude :     -155.4744    # deg
    latitude :      19.8263    # deg
    temperature :   2.5           # deg C
    humidity :      0.1         # [0..1]
    pressure :      0.620       # [bar]
    pwv :           2.5         # [mm]
    x_co2 :         450         # [ppm]
    airmass :       "!OBS.airmass"
    pupil_angle :   "!OBS.pupil_angle"
    pixel_scale :   "!INST.pixel_scale"
    background :
        filter_name : R
        value: 22.0
        unit: mag
    seeing : 0.7                # [arcsec]

effects :
- name : atmo_transmission    # Also applies thermal emission component using !ATMO.temperature and (1-transmission)
  description : Atmospheric transmission for Mauna Kea from TAPAS
  class : TERCurve
  include : True
  kwargs:
    filename: "TER_maunakea_tapas.dat"

- name : continuum_emission
  description : Continuum emission (only from moon, starlight, zodiacal light) from SkyCalc
  class : SkyBackgroundTERCurve
  include : True
  kwargs:
    disable_transmission: True
    # airglow re-enabled here because the PalaceAirglowEmission effect below is
    # disabled - see the note on that block. SkyCalc then supplies both the
    # airglow lines and the residual continuum.
    disable_airglow: False
    pwv: "!ATMO.pwv"
    wmin: "!SIM.spectral.wave_min"
    wmax: "!SIM.spectral.wave_max"
    wdelta: "!SIM.spectral.spectral_bin_width"
    wres: "!SIM.spectral.spectral_resolution"
    wunit: "!SIM.spectral.wave_unit"

## DISABLED 2026-08-20 (BPH). This block is commented out rather than set to
## include:False on purpose: ScopeSim's make_effect() constructs every effect
## before the include flag is ever consulted, so include:False would still run
## the PALACE model at load time and still crash.
##
## Why it crashes: run_palace() expects `palace.model()` to return a 3-tuple
## (_, spec_cont, spec_line), but the public PALACE v1.0 from Zenodo
## (https://zenodo.org/records/14064023) returns a single combined `spec`
## table. The fork was evidently written against a patched PALACE that splits
## line and continuum emission, and that version is not publicly released.
##
## Airglow is meanwhile supplied by SkyCalc above (disable_airglow: False).
## To restore PALACE, obtain the patched palace package from the ScopeSim fork
## authors, or adapt run_palace() to the v1.0 single-table return signature.
##
## Note also that PALACE is a *Paranal* airglow model being applied to Maunakea.
#
# - name : airglow_and_interline_continuum
#   description: Airglow emission lines and residual continuum from PALACE model
#   class : PalaceAirglowEmission
#   include : True
#   kwargs:
#     save_model_output: False
#     only_line: False
#     only_continuum: False
#     pwv: "!ATMO.pwv"
#     lammin: "!SIM.spectral.wave_min"
#     lammax: "!SIM.spectral.wave_max"
#     lamunit: "!SIM.spectral.wave_unit"

- name : seeing_psf
  description : Seeing limited but AO enhanceable Moffat PSF (wavelength dependent)
  class : AOEnhanceablePSF
  include : True
  kwargs:
    enable_ao: False
    ao_table: "ao_table.dat"
    is_absolute: True
    fwhm:
      seeing: "!ATMO.seeing"
      seeing_unit: "arcsec"
      pivot_wave: 500
      pivot_wave_unit: "nm"
    alpha: 4.765

## Currently, below ADC effect applies to all FoVs (i.e. including NIR arms). The effect can be made arm-specific by
## wrapping it in a SelectorWheel effect (see ZShooter_v2/ZShooter_SPEC.yaml for examples).
- name : adc_residuals
  description : Residuals after ADC correction, from LRIS ADC data and from positional error of 0.1 deg in AD correction
  class : ADCShift
  include : True
  kwargs:
    filename: "adc_residuals.dat"
    method: "roll"
    zenith_angle_error: 0.1
    wave_ref_um: 0.5